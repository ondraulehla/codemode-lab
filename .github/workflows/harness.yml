name: harness

# The token harness. NOT WIRED UP YET, on purpose.
#
# What it will do: run each task through a model both ways, direct tool calling and
# code mode, and read the billed input and output tokens off the API response. Every
# token figure in this repo today is an estimate from byte counts at 3.3 to 3.8 bytes
# per token. The harness is what replaces those estimates with numbers somebody
# billed, and until it runs, no page in this repo may print a token count without
# the word estimate next to it.
#
# THE OPEN DECISION, which is why the step below fails instead of running:
# the harness needs Anthropic API access, and the author wants to run it against his
# Claude subscription rather than buy pay as you go credits. Whether that is possible,
# and under which terms, is still being researched. Inventing an auth mechanism now
# would mean writing code against a guess, and a guess in the one workflow that
# produces the repo's authoritative numbers is worse than no workflow at all.
#
# When the decision lands, three things change here and nowhere else:
#   1. the credential arrives as a repository secret, read only by this workflow
#   2. the failing step becomes the harness run
#   3. the run writes results/<run-id>.json and results/README.md explains the shape
#
# Manual only. It is never on a schedule, and never on a pull request, because it
# is the only workflow in this repo that can cost money.
on:
  workflow_dispatch:
    inputs:
      task:
        description: 'Task id to measure, or "all"'
        required: false
        default: 'all'

permissions:
  contents: read

concurrency:
  group: harness
  cancel-in-progress: false

jobs:
  measure:
    name: measure billed tokens
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: set up node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm

      - name: install
        run: npm ci

      - name: build
        run: npx tsc --build

      # This step is the placeholder. It fails loudly rather than skipping quietly,
      # so nobody can read a green tick as "the billed numbers are in".
      - name: run the harness
        run: |
          echo "The token harness is not implemented yet."
          echo ""
          echo "It is blocked on one open decision: how it authenticates to the"
          echo "Anthropic API. The author intends to run it on a Claude subscription"
          echo "rather than on pay as you go credits, and that question is still open."
          echo ""
          echo "Until it is answered, every token figure in this repo is an estimate"
          echo "from byte counts, and every place that prints one says so."
          echo ""
          echo "Requested task: ${{ inputs.task }}"
          exit 1
