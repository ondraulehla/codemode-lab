name: harness

# The token harness does not run in CI. It runs locally, and harness/README.md says
# why: the Agent SDK pulls a platform binary of about 218 MB, the credential is
# personal and expires, forks get no secrets, and cache TTL depends on a billing
# state CI cannot see. The first local sweep ran on 2026-09-21 and its billed
# counts are in results/.
#
# This workflow stays as a manual placeholder that fails on purpose, so nobody can
# read a green tick here as "CI produced the billed numbers". If the harness ever
# moves to CI, three things change here and nowhere else:
#   1. the credential arrives as a repository secret, read only by this workflow
#   2. the failing step becomes `node harness/run.mjs` and `node harness/summarize.mjs`
#   3. the run uploads results/ as an artifact for a human to read and commit
#
# Manual only. It is never on a schedule, and never on a pull request, because it
# is the only workflow in this repo that could cost money.
on:
  workflow_dispatch:
    inputs:
      task:
        description: 'Task id to measure, or "all"'
        required: false
        default: 'all'

permissions:
  contents: read

concurrency:
  group: harness
  cancel-in-progress: false

jobs:
  measure:
    name: measure billed tokens
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: set up node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm

      - name: install
        run: npm ci

      - name: build
        run: npx tsc --build

      # This step is the placeholder. It fails loudly rather than skipping quietly,
      # so nobody can read a green tick as "the billed numbers are in".
      - name: run the harness
        run: |
          echo "The token harness runs locally, not in CI. See harness/README.md."
          echo ""
          echo "Billed counts come from a local sweep and are committed by a human"
          echo "after reading them: results/sweep-<run-id>.json and its summary."
          echo ""
          echo "Requested task: ${{ inputs.task }}"
          exit 1
